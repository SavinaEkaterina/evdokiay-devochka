<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Евдокия. Девочка лунного света</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <style>
        :root {
            --bg-color: #050a15;
            --book-w: 600px;
            --book-h: 870px;
            --shift-open-x: 0px;
            --paper-color: #fdfaf0;
            --ambient-light: rgba(255, 230, 150, 0);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--bg-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Georgia', serif;
            overflow: hidden;
            perspective: 2000px;
            transition: background 3s ease;
        }

        .ambient-glow {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 150vw; height: 150vh;
            background: radial-gradient(circle at center, var(--ambient-light) 0%, transparent 60%);
            pointer-events: none;
            z-index: 0;
            transition: background 3s ease;
        }

        .layout-shifter {
            position: relative;
            width: 100vw; height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 1.5s cubic-bezier(0.645, 0.045, 0.355, 1);
            z-index: 10;
        }

        .book-container {
            position: relative;
            width: var(--book-w);
            height: var(--book-h);
            transform-style: preserve-3d;
            transform: translateX(var(--shift-open-x));
            transition: transform 1.5s cubic-bezier(0.645, 0.045, 0.355, 1), width 0.5s ease, height 0.5s ease;
        }

        /* --- ВОССТАНОВЛЕННЫЕ СТИЛИ ОБЛОЖКИ --- */
        .book-cover {
            position: absolute;
            width: 100%; height: 100%;
            transform-style: preserve-3d;
            transform-origin: left center;
            transition: transform 1.5s cubic-bezier(0.645, 0.045, 0.355, 1), opacity 0.5s ease;
            z-index: 1000;
        }

        .b-face {
            position: absolute;
            width: 100%; height: 100%;
            backface-visibility: hidden;
            border-radius: 4px 12px 12px 4px;
        }

        .b-front {
            background-color: #1a2a40;
            background-image: var(--front-cover-img, none);
            background-size: cover;
            background-position: center;
            transform: translateZ(15px);
            box-shadow: inset 5px 0 20px rgba(0,0,0,0.5), 10px 10px 30px rgba(0,0,0,0.8);
            /* Добавлена плавность для возврата из свечения */
            transition: filter 0.6s ease-out, box-shadow 0.6s ease-out;
        }
        
        /* Гарантированное внешнее свечение и усиленная яркость */
        .b-front.magical-touch {
            /* Усиливаем яркость и контраст, чтобы "золото" заблестело */
            filter: brightness(1.2) contrast(1.15); 
        }

        #moonlightGlow.pulse-glow {
            /* Выводим свечение на 2D-фоновый слой, чтобы избежать обрезки 3D */
            box-shadow: 0 0 70px 30px rgba(176, 210, 255, 0.6) !important;
            transition: box-shadow 0.3s ease-out;
        }
        /* -------------------------------------- */

        /* --- СТИЛИ ДЛЯ ЛУЧА И ПОЛУМЕСЯЦА --- */
        .beam-overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            border-radius: 4px 12px 12px 4px;
            transform: translateZ(16px);
            overflow: hidden;
            pointer-events: none;
            z-index: 200;
        }

        /* 1. Сам серебристый луч */
        .beam-overlay::after {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: linear-gradient(110deg,
                rgba(255,255,255,0) 40%,
                rgba(176, 210, 255, 0.65) 50%,
                rgba(255,255,255,0) 60%
            );
            transform: translateX(-100%);
            opacity: 0;
        }

        /* 2. Деликатный полумесяц */
        .beam-overlay::before {
            content: '';
            position: absolute;
            right: 15%; 
            bottom: 20%;
            width: 14px; 
            height: 14px;
            border-radius: 50%;
            background: transparent;
            /* Формируем тончайший серп за счет смещения тени */
            box-shadow: -2px 2px 0 0 rgba(176, 210, 255, 0.85); 
            opacity: 0;
        }

        .beam-overlay.play-beam::after {
            animation: sweepBeam 2.5s ease-in-out forwards;
        }

        .beam-overlay.play-beam::before {
            /* Луч длится 2.5с. Запускаем формирование полумесяца на 2.1с, чтобы свет "перетёк" в него */
            animation: gatherCrescent 1.4s ease-in-out 2.1s forwards;
        }

        @keyframes sweepBeam {
            0% { transform: translateX(-100%); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateX(100%); opacity: 0; }
        }

        @keyframes gatherCrescent {
            0% { 
                opacity: 0; 
                transform: scale(0.2) rotate(-60deg); 
                filter: drop-shadow(0 0 2px rgba(176, 210, 255, 0.2));
            }
            20% { 
                opacity: 1; 
                transform: scale(1) rotate(-15deg); 
                filter: drop-shadow(0 0 4px rgba(176, 210, 255, 0.6));
            }
            75% { 
                /* Стадия мягкого свечения (удерживается ~0.7 сек) */
                opacity: 1; 
                transform: scale(1) rotate(-15deg); 
                filter: drop-shadow(0 0 3px rgba(176, 210, 255, 0.4)); 
            }
            100% { 
                /* Плавное растворение */
                opacity: 0; 
                transform: scale(1.05) rotate(0deg); 
                filter: drop-shadow(0 0 8px rgba(176, 210, 255, 0));
            }
        }
        /* -------------------------------------- */

        .b-back {
            transform: rotateY(180deg) translateZ(15px);
            background-color: #1a2a40;
            box-shadow: inset -5px 0 20px rgba(0,0,0,0.5);
            border-radius: 12px 4px 4px 12px;
        }

        .b-inner {
            transform: rotateY(180deg) translateZ(-14px);
            background-color: var(--paper-color);
            background-image: var(--endpaper-img, none); /* Исправлено: загружаем уникальный передний форзац */
            background-size: cover;
            background-position: center;
            border: 1px solid rgba(0,0,0,0.1);
            border-radius: 12px 4px 4px 12px;
            box-shadow: inset 0 0 40px rgba(139, 115, 85, 0.15);
            backface-visibility: hidden;
        }

        .spine-block {
            position: absolute;
            width: 30px;
            height: 100%;
            left: -15px;
            transform: rotateY(-90deg) translateZ(0);
            background-color: #0f1926;
            transform-style: preserve-3d;
            /* Добавлено для сокрытия луча, выходящего за рамки корешка */
            overflow: hidden;
        }

        /* Сам луч света на корешке */
        .spine-block::after {
            content: '';
            position: absolute;
            top: -100%; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(to bottom, rgba(255,255,255,0) 0%, rgba(176, 210, 255, 0.8) 50%, rgba(255,255,255,0) 100%);
            opacity: 0;
            pointer-events: none;
        }

        /* --- ЭФФЕКТ "ПРОБУЖДЕНИЯ" ПЕРЕД ОТКРЫТИЕМ (300мс) --- */
        .b-front.awakening-brightness {
            filter: brightness(1.25) contrast(1.1) drop-shadow(0 0 5px rgba(255,215,0,0.3)) !important;
            transition: filter 0.3s ease-out !important;
        }

        .beam-overlay.awakening-crescent::before {
            opacity: 1 !important;
            transform: scale(1.1) rotate(0deg) !important;
            filter: drop-shadow(0 0 8px rgba(176, 210, 255, 0.9)) !important;
            transition: all 0.3s ease-out !important;
        }

        .spine-block.awakening-spine-glow::after {
            animation: spineSpark 0.3s ease-in-out forwards;
        }

        @keyframes spineSpark {
            0% { top: -100%; opacity: 0; }
            50% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }

        /* --- ЭФФЕКТ ВНУТРЕННЕГО ЛУННОГО СВЕТА ПРИ ОТКРЫТИИ --- */
        /* 1. Свет на внутренней стороне обложки */
        .b-inner::after {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            /* Градиент от корешка к краю */
            background: linear-gradient(to left, rgba(176, 210, 255, 0.45) 0%, rgba(176, 210, 255, 0.1) 40%, transparent 70%);
            opacity: 0;
            pointer-events: none;
            border-radius: 12px 4px 4px 12px;
        }

        /* 2. Объемное свечение, вырывающееся из-под страниц и корешка */
        .pages-block::after {
            content: '';
            position: absolute;
            top: -2%; left: -20px;
            width: 40px; height: 104%;
            background: transparent;
            border-radius: 50%;
            opacity: 0;
            z-index: 500;
            pointer-events: none;
        }

        /* Запуск анимаций синхронно с механизмом открытия */
        .book-container.is-opened .b-inner::after {
            animation: innerCoverMoonlight 1.7s ease-out forwards;
        }

        .book-container.is-opened .pages-block::after {
            animation: spineSpillLight 1.7s ease-out forwards;
        }

        @keyframes innerCoverMoonlight {
            0% { opacity: 0; }
            15% { opacity: 0; } /* Пауза: ждем, пока обложка чуть приоткроется */
            35% { opacity: 1; } /* Пик свечения в полуоткрытом состоянии */
            75% { opacity: 0.3; } /* Плавное угасание по мере раскрытия */
            100% { opacity: 0; } /* Полностью чистая страница в конце */
        }

        @keyframes spineSpillLight {
            0% { box-shadow: 0 0 0px 0px rgba(176, 210, 255, 0); opacity: 0; }
            15% { box-shadow: -5px 0 10px 5px rgba(176, 210, 255, 0.2); opacity: 1; }
            35% { box-shadow: -20px 0 60px 30px rgba(176, 210, 255, 0.5); opacity: 1; } /* Свет заливает пространство */
            75% { box-shadow: -10px 0 20px 10px rgba(176, 210, 255, 0.1); opacity: 1; }
            100% { box-shadow: 0 0 0px 0px rgba(176, 210, 255, 0); opacity: 0; } /* Бесследно исчезает */
        }

        /* --- СЕКРЕТНОЕ ПОСЛАНИЕ (EASTER EGG) --- */
        #easterEggMsg {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: #111; /* Плотный черный цвет */
            font-size: 1.6rem;
            font-family: 'Georgia', serif;
            text-align: center;
            /* Мягкая белая тень-свечение для идеальной читаемости на любом фоне */
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.9), 0 0 5px rgba(255, 255, 255, 1);
            opacity: 0;
            pointer-events: none;
            z-index: 100;
            width: 80%;
        }

        #easterEggMsg.show {
            /* Общая длительность 4 секунды: 1с появление (0-25%), 2с удержание (25-75%), 1с исчезновение (75-100%) */
            animation: easterEggFade 4s ease-in-out forwards;
        }

        @keyframes easterEggFade {
            0% { opacity: 0; }
            25% { opacity: 1; }
            75% { opacity: 1; }
            100% { opacity: 0; }
        }
        /* --------------------------------------- */

        body.is-mobile-reader .spine-block {
            display: none;
        }

        .book-back-cover {
            position: absolute;
            width: 100%; height: 100%;
            transform: translateZ(-15px);
            background-color: #1a2a40;
            background-size: cover;
            background-position: center;
            border-radius: 4px 12px 12px 4px;
            box-shadow: 20px 20px 40px rgba(0,0,0,0.8), inset -5px 0 20px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            backface-visibility: hidden;
            transform-origin: left center;
            transition: transform 1.5s cubic-bezier(0.645, 0.045, 0.355, 1), opacity 0.5s ease;
            transform-style: preserve-3d;
        }

        .book-back-cover::after {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: #1a2a40;
            background-image: var(--back-cover-img, none);
            background-size: cover;
            background-position: center;
            transform: rotateY(180deg) translateZ(1px);
            backface-visibility: hidden;
            border-radius: 12px 4px 4px 12px;
            box-shadow: inset -5px 0 20px rgba(0,0,0,0.5);
        }

        .book-back-cover.is-closing-back {
            transform: rotateY(-180deg) translateZ(-15px);
            transition: transform 0.43s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Мобильный режим: закрываем обложку на месте по центру (без технического сдвига влево) */
        body.is-mobile-reader .book-back-cover {
            transform-origin: center center;
        }
        
        body.is-mobile-reader .book-back-cover.is-closing-back {
            transform: rotateY(-180deg) translateZ(16px);
            transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #backCoverFinal {
            position: absolute;
            width: 100%; height: 100%;
            background-color: #1a2a40;
            background-size: cover;
            background-position: center;
            border-radius: 12px 4px 4px 12px; 
            box-shadow: inset -5px 0 20px rgba(0,0,0,0.5);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.8s ease;
            z-index: 6000;
            transform: translateX(-100%) translateZ(16px); 
        }

        body.is-mobile-reader #backCoverFinal {
            transform: translateX(0) translateZ(16px);
        }
        
        #backCoverFinal.show {
            opacity: 1;
            pointer-events: auto;
            cursor: pointer;
            transition: opacity 0s;
        }

        .pages-block {
            position: absolute;
            width: 98%; height: 96%;
            top: 2%; left: 1%;
            transform-style: preserve-3d;
            z-index: 50;
        }

        body.is-mobile-reader .pages-block {
            width: 100%; height: 100%;
            top: 0; left: 0;
        }

        .leaf {
            position: absolute;
            width: 100%; height: 100%;
            transform-style: preserve-3d;
            transform-origin: left center;
            transition: transform 1.5s cubic-bezier(0.645, 0.045, 0.355, 1);
        }

        /* На мобильном режим листы анимируются простым слайдом/федором для чтения без изгиба разворота */
        body.is-mobile-reader .leaf {
            transform-origin: center center;
            transition: opacity 0.6s ease, transform 0.6s ease;
        }

        .leaf.is-turned {
            transform: rotateY(-180deg);
        }

        /* Новый чистый режим Mobile Reader */
        .mobile-page {
            position: absolute;
            width: 100%; height: 100%;
            background-color: var(--paper-color);
            background-size: 100% 100%;
            background-position: center;
            background-repeat: no-repeat;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            transition: opacity 0.5s ease, transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            opacity: 0;
            pointer-events: none;
            transform: translateX(20px) scale(0.98);
            z-index: 1;
        }

        .mobile-page.is-active {
            opacity: 1;
            pointer-events: auto;
            transform: translateX(0) scale(1);
            z-index: 5;
        }

        .mobile-page.is-turned {
            opacity: 0;
            pointer-events: none;
            transform: translateX(-40px) scale(0.95);
            z-index: 1;
        }

        .leaf-face {
            position: absolute;
            width: 100%; height: 100%;
            backface-visibility: hidden;
            background-color: var(--paper-color);
            background-size: 100% 100%;
            background-position: center;
            background-repeat: no-repeat;
            overflow: hidden;
            border-radius: 8px;
        }

        .leaf-front {
            transform: rotateY(0deg);
            border-radius: 2px 10px 10px 2px;
            /* Усиленные реалистичные тени переплета и толщины страницы */
            box-shadow: 
                inset 20px 0 35px -10px rgba(0,0,0,0.12), 
                inset 2px 0 6px -1px rgba(0,0,0,0.25),
                -1px 1px 2px rgba(0,0,0,0.08);
        }

        .leaf-back {
            transform: rotateY(180deg);
            border-radius: 10px 2px 2px 10px;
            /* Зеркальные тени для левой стороны разворота */
            box-shadow: 
                inset -20px 0 35px -10px rgba(0,0,0,0.12), 
                inset -2px 0 6px -1px rgba(0,0,0,0.25),
                1px 1px 2px rgba(0,0,0,0.08);
            background-color: var(--paper-color);
        }

        /* Динамическое освещение, объем и блики при перелистывании */
        .leaf-front::after, .leaf-back::after {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            /* Длительность и изгиб анимации точно совпадают с физикой переворачивания */
            transition: opacity 1.5s cubic-bezier(0.645, 0.045, 0.355, 1);
            border-radius: inherit;
        }

        /* Передняя сторона ловит яркий блик на изгибе бумаги и плавно затеняется к краю */
        .leaf-front::after {
            background: linear-gradient(
                to right, 
                rgba(0,0,0,0.25) 0%, 
                rgba(255,255,255,0.4) 10%, 
                rgba(255,255,255,0.0) 25%, 
                rgba(0,0,0,0.05) 60%, 
                rgba(0,0,0,0.3) 100%
            );
            opacity: 0; 
        }
        .leaf.is-turned .leaf-front::after {
            opacity: 1; /* В вертикальном положении (на середине пути) градиент создает объемный изгиб */
        }

        /* Задняя сторона плавно ложится на стол, теряя изгиб и световой блик */
        .leaf-back::after {
            background: linear-gradient(
                to left, 
                rgba(0,0,0,0.25) 0%, 
                rgba(255,255,255,0.4) 10%, 
                rgba(255,255,255,0.0) 25%, 
                rgba(0,0,0,0.05) 60%, 
                rgba(0,0,0,0.3) 100%
            );
            opacity: 1; /* Градиент активен на старте движения, пока страница в воздухе */
        }
        .leaf.is-turned .leaf-back::after {
            opacity: 0; /* Страница легла - свет выровнялся, тени отступили */
        }
        
        /* --- ЭФФЕКТ ДЕЛИКАТНОГО ПОЯВЛЕНИЯ ТЕКСТА --- */
        .reveal-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 20;
            border-radius: inherit; overflow: hidden;
            background-color: var(--paper-color); /* Используем цвет самой бумаги для реалистичной дымки */
            opacity: 0; 
        }
        .reveal-overlay.is-active {
            animation: hazeAndClear 2.5s ease-out forwards;
        }
        .reveal-overlay::after {
            content: ''; position: absolute;
            top: -100%; left: 0; width: 100%; height: 100%;
            /* Яркий, широкий луч с легким лунным оттенком в центре */
            background: linear-gradient(
                to bottom, 
                rgba(255,255,255,0) 0%, 
                rgba(255,255,255,0.85) 40%, 
                rgba(176, 210, 255, 0.4) 50%,
                rgba(255,255,255,0.85) 60%, 
                rgba(255,255,255,0) 100%
            );
            opacity: 0;
        }
        .reveal-overlay.is-active::after {
            animation: sweepRevealBeam 1.5s ease-in-out 1s forwards;
        }
        
        @keyframes hazeAndClear {
            0% { opacity: 0; }
            10% { opacity: 0.65; } /* Мгновенно накрываем страницу полупрозрачной калькой (текст теряет контраст) */
            45% { opacity: 0.65; } /* Удерживаем низкий контраст 1 секунду, пока не начнется луч */
            80% { opacity: 0; }    /* Плавно растворяется вслед за лучом, делая текст идеально чётким */
            100% { opacity: 0; }
        }
        
        @keyframes sweepRevealBeam {
            0% { top: -100%; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }
        /* ------------------------------------------- */

        /* Исправлено: используем свободный слой ::before, чтобы не ломать физику изгиба бумаги ::after */
        .passing-cloud::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(10, 15, 30, 0.07); /* Чуть более плотный, прохладный лунный оттенок для тени */
            pointer-events: none;
            border-radius: inherit;
            z-index: 100;
            opacity: 0;
            animation: passingCloudShadow 7s ease-in-out forwards;
        }

        @keyframes passingCloudShadow {
            0% { opacity: 0; }
            45% { opacity: 1; } /* Пик мягкой тени */
            100% { opacity: 0; }
        }

        .fallback-text {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            color: rgba(139, 115, 85, 0.5);
            font-size: 1.5rem;
            border: 2px dashed rgba(139, 115, 85, 0.3);
            text-align: center;
            padding: 20px;
        }

        .reading-btn {
            position: absolute;
            top: 20px; right: 20px;
            background: rgba(10, 15, 30, 0.6);
            border: 1px solid rgba(255, 230, 150, 0.3);
            color: #ffe696;
            padding: 12px;
            border-radius: 50%;
            cursor: pointer;
            z-index: 4000;
            font-size: 1.5rem;
            backdrop-filter: blur(5px);
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s ease;
        }
        .reading-btn.show { opacity: 1; pointer-events: auto; }
        .reading-btn:hover { background: rgba(255, 230, 150, 0.15); transform: scale(1.05); }

        #audioBtn {
            right: 80px;
        }

        .book-tactile-wrapper {
            position: absolute;
            top: 0; left: 50%;
            width: 200%; height: 100%;

<body>

    <div id="startScreen">
        <button id="startBtn">Войти в сказку</button>
    </div>

    <div id="blackOverlay"></div>
    <div id="touchPrompt">Прикоснитесь к книге…<br>Лунный свет уже ждёт вас. 🌙</div>
    <div id="prologueContainer">
        <!-- Убрали muted и autoplay, видео запустится после клика -->
        <video id="introVideo" playsinline preload="auto"></video>
        <button id="skipIntroBtn">Пропустить вступление</button>
    </div>

    <!-- Контейнер финального видео (эпилога) -->
    <div id="epilogueContainer">
        <video id="outroVideo" playsinline muted></video>
        <button id="skipOutroBtn">Пропустить видео</button>
    </div>

    <div class="ambient-glow" id="ambientGlow"></div>
    <button class="reading-btn" id="readingBtn" onclick="window.engine.toggleReadingMode()">📖</button>
    <button class="reading-btn" id="audioBtn" onclick="window.engine.toggleAudioMode()">🔇</button>

    <div class="layout-shifter" id="layoutShifter">
        <div id="moonlightGlow"></div>
        
        <div class="book-container" id="bookContainer">
            
            <!-- Обложка -->
            <div class="book-cover" id="bookCover" onmouseenter="window.triggerMagicalPulse()" ontouchstart="window.triggerMagicalPulse()" onclick="window.engine.openBook()">
                <div class="b-face b-front"></div>
                <!-- Единый, надежный слой луча -->
                <div class="beam-overlay" id="coverBeam"></div>
                
                <div class="b-face b-back"></div>
                <div class="b-face b-inner">
                    <!-- Блок для секретного сообщения -->
                    <div id="easterEggMsg">Спасибо, что поверили в сказку.</div>
                </div>
                <div class="spine-block"></div>
            </div>

            <!-- Задняя часть книги -->
            <div class="book-back-cover" id="oldBackCover" onclick="window.engine.flipToFront()">
            </div>

            <!-- Финальная обложка (изображение) -->
            <div id="backCoverFinal" onclick="window.engine.flipToFront()"></div>

            <!-- Контейнер для физических листов -->
            <div class="pages-block" id="realPagesContainer"></div>
            
            <!-- Зона перелистывания -->
            <div class="book-tactile-wrapper" id="tactileWrapper">
                <div class="touch-left" onclick="window.engine.turnPage('prev')"></div>
                <div class="touch-right" onclick="window.engine.turnPage('next')"></div>
            </div>
        </div>
    </div>

    <script>
        const ENABLE_INTRO = true;       // Поставьте false, чтобы отключить пролог
        
        // Указываем путь к папке video/
        const INTRO_VIDEO = "video/intro.mp4"; 

        const ENABLE_OUTRO = true;       // Включить финальное видео
        const OUTRO_VIDEO = "video/outro.mp4"; // Имя файла для финального видео

        // Массив страниц БЕЗ расширений
        const BOOK_PAGES = [
            "title-page",
            "epigraph-page",
            "dedication-page",
            "chapter-01-page-01",
            "chapter-01-page-02",
            "chapter-01-page-03",
            "chapter-01-page-04",
            "chapter-01-page-05",
            "chapter-01-page-06",
            "chapter-01-page-07",
            "chapter-01-page-08",
            "chapter-01-page-09",
            "chapter-01-page-10",
            "chapter-01-page-11",
            "chapter-01-page-12",
            "chapter-01-page-13",
            "chapter-01-page-14",
            "chapter-01-page-15",
            "chapter-01-page-16",
            "chapter-01-page-17",
            "chapter-01-page-18",
            "chapter-01-page-19"
        ];

        window.bookState = "STATE_COVER"; 

        let hasInteracted = false;
        
        window.triggerMagicalPulse = () => {
            // Запускаем только один раз, только когда книга закрыта и все анимации пролога завершены
            if (hasInteracted || window.bookState !== "STATE_COVER" || (window.engine && window.engine.isAnimating)) return;
            hasInteracted = true;

            const layoutShifter = document.getElementById('layoutShifter');
            const bFront = document.querySelector('.b-front');
            const moonlightGlow = document.getElementById('moonlightGlow'); // Берем фоновый слой

            // Включаем яркость обложки и свечение фона
            if (bFront) bFront.classList.add('magical-touch');
            if (moonlightGlow) moonlightGlow.classList.add('pulse-glow');
            
            // Плавное увеличение масштаба (на 1.5%)
            if (layoutShifter) {
                layoutShifter.style.transition = 'transform 0.6s ease-out';
                layoutShifter.style.transform = 'scale(1.015)';
            }

            // Плавный возврат в исходное состояние через 0.6 сек
            setTimeout(() => {
                if (bFront) bFront.classList.remove('magical-touch');
                if (moonlightGlow) moonlightGlow.classList.remove('pulse-glow');
                
                if (layoutShifter) {
                    if (window.engine && !window.engine.isReadingMode) {
                        layoutShifter.style.transition = 'transform 0.8s ease-in-out';
                        layoutShifter.style.transform = 'scale(1)';
                    }
                    // Возвращаем дефолтные параметры плавности для других анимаций книги
                    setTimeout(() => {
                        layoutShifter.style.transition = 'transform 1.5s cubic-bezier(0.645, 0.045, 0.355, 1)';
                    }, 800);
                }
            }, 600);
        };

        class BookEngine {
            constructor(pagesArray) {
                this.pages = pagesArray;
                this.currentPageIndex = 0; // Для мобильного режима: индекс текущей страницы из массива
                this.currentLeafIndex = 0; // Для десктопного режима: индекс текущего листа
                this.isAnimating = false;
                this.isReadingMode = false;
                this.isMobileReader = window.innerWidth < 768;
                this.cloudTimer = null;
                
                // Для системы озвучки
                this.isAudioMode = false;
                this.currentVoiceover = null;
                this.voiceoverResolve = null;
            }

            initAudio() {
                try {
                    // Шелест страниц (используем brown noise для плотной бумаги + фильтр)
                    this.paperSynth = new Tone.NoiseSynth({
                        noise: { type: "brown" },
                        envelope: { attack: 0.05, decay: 0.4, sustain: 0, release: 0.1 }
                    });
                    this.paperFilter = new Tone.Filter(1200, "lowpass").toDestination();
                    this.paperSynth.connect(this.paperFilter);
                    this.paperSynth.volume.value = -3;

                    // Волшебные аккорды при перелистывании и открытии
                    this.magicSynth = new Tone.PolySynth(Tone.Synth, {
                        oscillator: { type: "sine" },
                        envelope: { attack: 0.3, decay: 2, sustain: 0.2, release: 3 }
                    }).toDestination();
                    this.magicSynth.volume.value = -12;

                    // Мягкий атмосферный фон (дрон)
                    this.bgDrone = new Tone.FMSynth({
                        harmonicity: 0.5,
                        modulationIndex: 1.2,
                        oscillator: { type: "sine" },
                        modulation: { type: "triangle" },
                        envelope: { attack: 3, decay: 1, sustain: 1, release: 4 }
                    }).toDestination();
                    this.bgDrone.volume.value = -28;
                } catch(e) {
                    console.warn("Аудио не удалось инициализировать", e);
                }
            }

            playPageTurnSound() {
                if (typeof Tone !== 'undefined' && Tone.context.state !== 'running') Tone.context.resume();
                if (this.paperSynth) this.paperSynth.triggerAttackRelease(0.3);
                
                // Добавляем случайную музыкальную ноту при перелистывании для магии
                if (this.magicSynth && Math.random() > 0.4) {
                    const notes = ["C5", "E5", "G5", "A5"];
                    this.magicSynth.triggerAttackRelease(notes[Math.floor(Math.random()*notes.length)], "8n", "+0.1");
                }
            }

            updateLayout() {
                const w = window.innerWidth;
                const h = window.innerHeight;
                const pageRatio = 1 / 1.45; 
                let singlePageW, singlePageH;
                this.isMobileReader = w < 768;

                if (this.isMobileReader) {
                    document.body.classList.add('is-mobile-reader');
                    let maxPageW = w * 0.90; 
                    let maxPageH = h * 0.85;

                    singlePageH = maxPageH;
                    singlePageW = singlePageH * pageRatio;

                    if (singlePageW > maxPageW) {
                        singlePageW = maxPageW;
                        singlePageH = singlePageW / pageRatio;
                    }
                } else {
                    document.body.classList.remove('is-mobile-reader');
                    let maxPageW = w * 0.46; 
                    if (maxPageW > 600) maxPageW = 600; 
                    let maxPageH = h * 0.85;

                    singlePageH = maxPageH;
                    singlePageW = singlePageH * pageRatio;

                    if (singlePageW > maxPageW) {
                        singlePageW = maxPageW;
                        singlePageH = singlePageW / pageRatio;
                    }
                }

                document.documentElement.style.setProperty('--book-w', `${singlePageW}px`);
                document.documentElement.style.setProperty('--book-h', `${singlePageH}px`);
                
                if (window.bookState === "STATE_OPEN" || window.bookState === "opening") {
                    if (!this.isReadingMode) {
                        if (this.isMobileReader) {
                            document.documentElement.style.setProperty('--shift-open-x', '0px');
                        } else {
                            document.documentElement.style.setProperty('--shift-open-x', '50%');
                        }
                    }
                } else if (window.bookState === "STATE_COVER" || window.bookState === "STATE_CLOSED_BACK" || window.bookState === "closing") {
                    if (window.bookState === "STATE_COVER") {
                        document.documentElement.style.setProperty('--shift-open-x', '0px');
                    } else {
                        // Когда закрываем на заднюю обложку (она переворачивается влево),
                        // сдвигаем контейнер вправо на 100%, чтобы компенсировать сдвиг и оставить книгу по центру
                        if (this.isMobileReader) {
                            document.documentElement.style.setProperty('--shift-open-x', '0px');
                        } else {
                            document.documentElement.style.setProperty('--shift-open-x', '100%');
                        }
                    }
                }
            }

            async loadAndSetImage(baseName, element) {
                if (!baseName) return;

                // Добавили .webp на первое место для приоритетной и быстрой загрузки
                const extensions = ['.webp', '.png', '.jpeg', '.jpg'];
                
                const validUrl = await new Promise((resolve) => {
                    let failedCount = 0;
                    let found = false;

                    extensions.forEach(ext => {
                        // Добавляем путь к папке image/
                        const testUrl = 'image/' + baseName + ext;
                        const img = new Image();
                        
                        img.onload = () => {
                            if (!found) {
                                found = true;
                                resolve(testUrl);
                            }
                        };
                        
                        img.onerror = () => {
                            failedCount++;
                            if (failedCount === extensions.length && !found) {
                                resolve(null);
                            }
                        };
                        
                        img.src = testUrl;
                    });
                });

                if (validUrl) {
                    element.style.backgroundImage = `url('${validUrl}')`;
                    element.innerHTML = '';
                    document.documentElement.style.setProperty(`--${baseName}-img`, `url('${validUrl}')`);
                } else {
                    element.innerHTML = `<div class="fallback-text">${baseName}</div>`;
                    element.style.backgroundImage = 'none';
                }
            }

            initPhysicalPages() {
                const container = document.getElementById('realPagesContainer');
                if (!container) return;
                
                container.innerHTML = ''; 

                if (this.isMobileReader) {
                    // Новый режим Mobile Reader: одиночные центрированные страницы без геометрии разворота
                    this.pages.forEach((pageBaseName, index) => {
                        const pageEl = document.createElement('div');
                        pageEl.className = 'mobile-page';
                        
                        if (index < this.currentPageIndex) {
                            pageEl.classList.add('is-turned');
                        } else if (index === this.currentPageIndex) {
                            pageEl.classList.add('is-active');
                        }
                        
                        if (pageBaseName) this.loadAndSetImage(pageBaseName, pageEl);
                        
                        // Добавляем слой для эффекта проявления
                        const revealMobile = document.createElement('div');
                        revealMobile.className = 'reveal-overlay';
                        pageEl.appendChild(revealMobile);
                        
                        container.appendChild(pageEl);
                    });
                } else {
                    // Desktop / Tablet: Физические 3D-листы (разворот)
                    const leavesCount = Math.ceil(this.pages.length / 2);
                    
                    for (let i = 0; i < leavesCount; i++) {
                        const frontPageBaseName = this.pages[i * 2];     
                        let backPageBaseName = this.pages[i * 2 + 1];  

                        if (i === leavesCount - 1 && !backPageBaseName) {
                            backPageBaseName = 'back-endpaper';
                        }

                        const leaf = document.createElement('div');
                        leaf.className = 'leaf';
                        if (i < this.currentLeafIndex) {
                            leaf.classList.add('is-turned');
                        }
                        
                        const frontDiv = document.createElement('div');
                        frontDiv.className = 'leaf-face leaf-front';
                        if (frontPageBaseName) this.loadAndSetImage(frontPageBaseName, frontDiv);
                        
                        const backDiv = document.createElement('div');
                        backDiv.className = 'leaf-face leaf-back';
                        if (backPageBaseName) this.loadAndSetImage(backPageBaseName, backDiv);

                        // Добавляем слои для эффекта проявления
                        const revealFront = document.createElement('div');
                        revealFront.className = 'reveal-overlay';
                        frontDiv.appendChild(revealFront);
                        
                        const revealBack = document.createElement('div');
                        revealBack.className = 'reveal-overlay';
                        backDiv.appendChild(revealBack);

                        leaf.appendChild(frontDiv);
                        leaf.appendChild(backDiv);
                        container.appendChild(leaf);
                    }
                }
                
                if (this.currentLeafIndex > 0 || this.currentPageIndex > 0) this.isolateCover();
                this.updateZIndices();
            }

            triggerCloudShadow() {
                if (this.cloudTimer) clearTimeout(this.cloudTimer);
                
                // Удаляем предыдущие тени, если они зависли
                document.querySelectorAll('.passing-cloud').forEach(el => el.classList.remove('passing-cloud'));
                
                this.cloudTimer = setTimeout(() => {
                    if (window.bookState !== "STATE_OPEN" || this.isAnimating) return;
                    
                    if (this.isMobileReader) {
                        const activePage = document.querySelector('.mobile-page.is-active');
                        if (activePage) activePage.classList.add('passing-cloud');
                    } else {
                        // Ищем текущий открытый разворот
                        const leaves = document.querySelectorAll('.leaf');
                        const currentIndex = this.currentLeafIndex;
                        
                        // Добавляем тень на левую страницу (leaf-back предыдущего листа)
                        if (currentIndex > 0) {
                            const prevLeaf = leaves[currentIndex - 1];
                            const backFace = prevLeaf.querySelector('.leaf-back');
                            if (backFace) backFace.classList.add('passing-cloud');
                        }
                        
                        // Добавляем тень на правую страницу (leaf-front текущего листа)
                if (currentIndex < leaves.length) {
                    const currentLeaf = leaves[currentIndex];
                    const frontFace = currentLeaf.querySelector('.leaf-front');
                    if (frontFace) frontFace.classList.add('passing-cloud');
                }
            }
        }, 1500); // Сокращаем ожидание до 1.5 секунд после открытия разворота, чтобы сразу увидеть эффект
    }

            triggerPageReveal() {
                if (this.isMobileReader) {
                    const activePage = document.querySelector('.mobile-page.is-active');
                    if (activePage) {
                        const overlay = activePage.querySelector('.reveal-overlay');
                        if (overlay && !overlay.dataset.revealed) {
                            overlay.dataset.revealed = 'true';
                            void overlay.offsetWidth; // Принудительный reflow
                            overlay.classList.add('is-active');
                        }
                    }
                } else {
                    const leaves = document.querySelectorAll('.leaf');
                    const currentIndex = this.currentLeafIndex;
                    
                    if (currentIndex > 0) {
                        const prevLeaf = leaves[currentIndex - 1];
                        const backFace = prevLeaf.querySelector('.leaf-back');
                        if (backFace) {
                            const overlay = backFace.querySelector('.reveal-overlay');
                            if (overlay && !overlay.dataset.revealed) {
                                overlay.dataset.revealed = 'true';
                                void overlay.offsetWidth;
                                overlay.classList.add('is-active');
                            }
                        }
                    }
                    if (currentIndex < leaves.length) {
                        const currentLeaf = leaves[currentIndex];
                        const frontFace = currentLeaf.querySelector('.leaf-front');
                        if (frontFace) {
                            const overlay = frontFace.querySelector('.reveal-overlay');
                            if (overlay && !overlay.dataset.revealed) {
                                overlay.dataset.revealed = 'true';
                                void overlay.offsetWidth;
                                overlay.classList.add('is-active');
                            }
                        }
                    }
                }
            }

    isolateCover() {
                const cover = document.getElementById('bookCover');
                if (cover) {
                    const bBack = cover.querySelector('.b-back');
                    if (bBack) bBack.style.display = 'none';
                    cover.style.transform = 'rotateY(-180deg) translateZ(30px)';
                }
            }

            openBook() {
                if (window.bookState !== "STATE_COVER" || this.isAnimating) return;
                
                // Мгновенно скрываем атмосферную подсказку при клике на книгу
                const prompt = document.getElementById('touchPrompt');
                if (prompt) {
                    prompt.classList.remove('show');
                    if (window.promptTimeout) clearTimeout(window.promptTimeout);
                }

                this.isAnimating = true;

                // --- ЗАПУСК ЭФФЕКТА "ПРОБУЖДЕНИЯ" ПЕРЕД ОТКРЫТИЕМ ---
                const bFront = document.querySelector('.b-front');
                const beam = document.getElementById('coverBeam');
                const spine = document.querySelector('.spine-block');

                if (bFront) bFront.classList.add('awakening-brightness');
                if (beam) beam.classList.add('awakening-crescent');
                if (spine) spine.classList.add('awakening-spine-glow');

                // Ждем 300мс, пока книга вспыхивает от прикосновения, затем запускаем стандартное открытие
                setTimeout(() => {
                    window.bookState = "opening";

                    const bBack = document.querySelector('.b-back');
                    if (bBack) bBack.style.display = 'none';

                    document.getElementById('bookContainer').classList.add('is-opened');
                    this.updateLayout();

                    // Воспроизводим звук открытия и запускаем фон
                    if (typeof Tone !== 'undefined' && Tone.context.state !== 'running') Tone.context.resume();
                    if (this.magicSynth) this.magicSynth.triggerAttackRelease(["C4", "E4", "G4", "C5"], "2n");
                    if (this.bgDrone) this.bgDrone.triggerAttack("C3");
                    
                    setTimeout(() => {
                        window.bookState = "STATE_OPEN";
                        this.isolateCover(); 
                        
                        const tactile = document.getElementById('tactileWrapper');
                        if (tactile) tactile.style.display = "flex";
                        
                        const btn = document.getElementById('readingBtn');
                        if (btn) btn.classList.add('show');
                        
                        const audioBtn = document.getElementById('audioBtn');
                        if (audioBtn) audioBtn.classList.add('show');
                        
                        this.updateZIndices(); 
                        this.isAnimating = false;

                        // Очищаем классы эффекта, чтобы они могли сработать при следующем цикле
                        if (bFront) bFront.classList.remove('awakening-brightness');
                        if (beam) beam.classList.remove('awakening-crescent');
                        if (spine) spine.classList.remove('awakening-spine-glow');
                        
                        this.triggerCloudShadow();
                        this.triggerPageReveal();

                        // --- ПРОВЕРКА И ПОКАЗ СЕКРЕТНОГО СООБЩЕНИЯ ---
                        const isFinished = localStorage.getItem('evdokia_book_finished') === 'true';
                        const isShown = localStorage.getItem('evdokia_easter_egg_shown') === 'true';
                        
                        if (isFinished && !isShown) {
                            if (this.isMobileReader) {
                                // Мобильная версия: всплывающая плашка по центру экрана
                                const mobileMsg = document.createElement('div');
                                mobileMsg.id = 'mobileEasterEgg';
                                mobileMsg.innerHTML = 'Спасибо, что поверили в сказку.';
                                mobileMsg.style.cssText = `
                                    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
                                    background: rgba(253, 250, 245, 0.95); border: 1px solid rgba(139, 115, 85, 0.3);
                                    color: #111; padding: 20px 30px; border-radius: 12px;
                                    font-family: 'Georgia', serif; font-size: 1.2rem; text-align: center;
                                    text-shadow: 0 1px 4px rgba(255, 255, 255, 0.8);
                                    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5); backdrop-filter: blur(5px);
                                    opacity: 0; transition: opacity 1s ease; z-index: 10000; width: 85%;
                                `;
                                document.body.appendChild(mobileMsg);
                                
                                setTimeout(() => mobileMsg.style.opacity = '1', 100);
                                setTimeout(() => {
                                    mobileMsg.style.opacity = '0';
                                    setTimeout(() => mobileMsg.remove(), 1000);
                                }, 3500);
                            } else {
                                // Десктопная версия: надпись на форзаце
                                const msg = document.getElementById('easterEggMsg');
                                if (msg) msg.classList.add('show');
                            }
                            localStorage.setItem('evdokia_easter_egg_shown', 'true');
                        }
                        // ---------------------------------------------

                        this.playVoiceover();

                    }, 1800);
                }, 300); // 300мс паузы на свечение
            }

            updateZIndices(activeTurnIndex = -1) {
                const leaves = document.querySelectorAll('.leaf');
                const cover = document.getElementById('bookCover');
                
                if (cover) {
                    cover.style.zIndex = (window.bookState === "STATE_OPEN") ? 0 : 1000;
                }
                
                if (this.isMobileReader) {
                    const mobilePages = document.querySelectorAll('.mobile-page');
                    mobilePages.forEach((page, i) => {
                        if (i === this.currentPageIndex) {
                            page.style.zIndex = 50;
                        } else if (i < this.currentPageIndex) {
                            page.style.zIndex = 10;
                        } else {
                            page.style.zIndex = 20 - (i - this.currentPageIndex);
                        }
                    });
                    return;
                }

                const currentIndex = this.currentLeafIndex;

                leaves.forEach((leaf, i) => {
                    if (i === activeTurnIndex) {
                        leaf.style.zIndex = leaves.length + 100; 
                    } else if (i < currentIndex) {
                        leaf.style.zIndex = i + 10;
                    } else {
                        leaf.style.zIndex = leaves.length - i;
                    }
                });
            }

            turnPage(direction) {
                if (this.isAnimating || window.bookState !== "STATE_OPEN") return;
                
                if (this.cloudTimer) clearTimeout(this.cloudTimer);
                document.querySelectorAll('.passing-cloud').forEach(el => el.classList.remove('passing-cloud'));
                
                this.stopVoiceover();
                
                const leaves = document.querySelectorAll('.leaf');
                const mobilePages = document.querySelectorAll('.mobile-page');
                
                if (this.isMobileReader) {
                    // Новый Mobile Reader: одна страница по центру
                    if (direction === 'next') {
                        if (this.currentPageIndex >= mobilePages.length) {
                            this.closeBook();
                            return;
                        }
                        this.isAnimating = true;
                        this.playPageTurnSound();
                        
                        const currentPage = mobilePages[this.currentPageIndex];
                        if (currentPage) {
                            currentPage.classList.remove('is-active');
                            currentPage.classList.add('is-turned');
                        }
                        
                        this.currentPageIndex++;
                        const nextPage = mobilePages[this.currentPageIndex];
                        if (nextPage) {
                            nextPage.classList.add('is-active');
                        }
                        
                        this.updateZIndices();
                        
                        setTimeout(() => {
                            this.finalizeTurn();
                        }, 400);

                    } else if (direction === 'prev') {
                        if (this.currentPageIndex <= 0) return;
                        this.isAnimating = true;
                        this.playPageTurnSound();

                        const currentPage = mobilePages[this.currentPageIndex];
                        if (currentPage) {
                            currentPage.classList.remove('is-active');
                        }
                        
                        this.currentPageIndex--;
                        const prevPage = mobilePages[this.currentPageIndex];
                        if (prevPage) {
                            prevPage.classList.remove('is-turned');
                            prevPage.classList.add('is-active');
                        }

                        this.updateZIndices();

                        setTimeout(() => {
                            this.finalizeTurn();
                        }, 400);
                    }

                } else {
                    // Desktop/Tablet logic
                    if (direction === 'next') {
                        if (this.currentLeafIndex >= leaves.length) return; 
                        this.isAnimating = true;
                        const leaf = leaves[this.currentLeafIndex];
                        this.playPageTurnSound();
                        leaf.classList.add('is-turned');
                        this.updateZIndices(this.currentLeafIndex);
                        setTimeout(() => {
                            this.currentLeafIndex++; 
                            this.finalizeTurn();
                        }, 1500);

                    } else if (direction === 'prev') {
                        if (this.currentLeafIndex <= 0) return; 
                        this.isAnimating = true;
                        const leaf = leaves[this.currentLeafIndex - 1];
                        this.playPageTurnSound();
                        leaf.classList.remove('is-turned');
                        this.updateZIndices(this.currentLeafIndex - 1);
                        setTimeout(() => {
                            this.currentLeafIndex--; 
                            this.finalizeTurn();
                        }, 1500);
                    }
                }
            }

            finalizeTurn() {
                this.updateZIndices();
                this.isAnimating = false;
                
                const maxIndex = this.isMobileReader ? document.querySelectorAll('.mobile-page').length : document.querySelectorAll('.leaf').length;
                const currentIndex = this.isMobileReader ? this.currentPageIndex : this.currentLeafIndex;
                
                localStorage.setItem('evdokia_progress', currentIndex);

                if (currentIndex === maxIndex) {
                    // Пользователь дошел до самого конца книги
                    localStorage.setItem('evdokia_book_finished', 'true'); 
                    
                    setTimeout(() => {
                        if (window.bookState === "STATE_OPEN") {
                            this.closeBook();
                        }
                    }, 400);
                } else {
                    this.triggerCloudShadow();
                    this.triggerPageReveal();
                    this.playVoiceover();
                }
            }

            toggleReadingMode() {
                this.isReadingMode = !this.isReadingMode;
                const layout = document.getElementById('layoutShifter');
                const btn = document.getElementById('readingBtn');
                
                if (this.isReadingMode) {
                    layout.style.transform = `scale(1.1)`;
                    document.documentElement.style.setProperty('--bg-color', '#02040a');
                    btn.style.color = "#fff";
                    btn.style.background = "rgba(255,255,255,0.1)";
                } else {
                    layout.style.transform = `scale(1)`;
                    document.documentElement.style.setProperty('--bg-color', '#050a15');
                    btn.style.color = "#ffe696";
                    btn.style.background = "rgba(10, 15, 30, 0.6)";
                }
                this.updateLayout();
            }

            toggleAudioMode() {
                this.isAudioMode = !this.isAudioMode;
                const btn = document.getElementById('audioBtn');
                
                if (this.isAudioMode) {
                    btn.innerHTML = '🔊';
                    btn.style.color = "#fff";
                    btn.style.background = "rgba(255,255,255,0.1)";
                    this.playVoiceover();
                } else {
                    btn.innerHTML = '🔇';
                    btn.style.color = "#ffe696";
                    btn.style.background = "rgba(10, 15, 30, 0.6)";
                    this.stopVoiceover();
                }
            }

            playSingleAudio(baseName) {
                return new Promise((resolve) => {
                    this.voiceoverResolve = resolve;
                    // Добавляем путь к папке audio/
                    const audio = new Audio('audio/' + baseName + '.wav');
                    this.currentVoiceover = audio;
                    
                    audio.onended = () => {
                        this.currentVoiceover = null;
                        if (this.voiceoverResolve) this.voiceoverResolve();
                    };
                    audio.onerror = () => {
                        this.currentVoiceover = null; // Файла нет - просто молчим
                        if (this.voiceoverResolve) this.voiceoverResolve();
                    };
                    
                    audio.play().catch(e => {
                        this.currentVoiceover = null;
                        if (this.voiceoverResolve) this.voiceoverResolve();
                    });
                });
            }

            stopVoiceover() {
                if (this.currentVoiceover) {
                    this.currentVoiceover.pause();
                    this.currentVoiceover.currentTime = 0;
                    this.currentVoiceover = null;
                }
                if (this.voiceoverResolve) {
                    this.voiceoverResolve();
                    this.voiceoverResolve = null;
                }
            }

            async playVoiceover() {
                if (!this.isAudioMode || this.isAnimating || window.bookState !== "STATE_OPEN") return;
                this.stopVoiceover();

                if (this.isMobileReader) {
                    // Мобильная версия (1 страница)
                    const pageName = this.pages[this.currentPageIndex];
                    if (pageName) await this.playSingleAudio(pageName);
                } else {
                    // ПК версия (разворот: левая и правая страницы)
                    const idx = this.currentLeafIndex;
                    const leftPage = idx > 0 ? this.pages[idx * 2 - 1] : null;
                    const rightPage = idx * 2 < this.pages.length ? this.pages[idx * 2] : null;

                    if (leftPage) {
                        await this.playSingleAudio(leftPage);
                    }
                    
                    // Если после левой страницы пользователь не перелистнул книгу, читаем правую
                    if (this.isAudioMode && this.currentLeafIndex === idx && rightPage) {
                        await this.playSingleAudio(rightPage);
                    }
                }
            }

            closeBook() {
                if (window.bookState !== "STATE_OPEN" || this.isAnimating) return;
                
                if (this.cloudTimer) clearTimeout(this.cloudTimer);
                document.querySelectorAll('.passing-cloud').forEach(el => el.classList.remove('passing-cloud'));
                
                this.isAnimating = true;
                window.bookState = "closing";
                this.updateLayout();

                const tactile = document.getElementById('tactileWrapper');
                if (tactile) tactile.style.display = "none";
                
                const btn = document.getElementById('readingBtn');
                if (btn) btn.classList.remove('show');

                const audioBtn = document.getElementById('audioBtn');
                if (audioBtn) audioBtn.classList.remove('show');
                
                this.stopVoiceover();

                if (this.isReadingMode) {
                    this.toggleReadingMode();
                }

                const oldBackCover = document.getElementById('oldBackCover');
                if (oldBackCover) {
                    oldBackCover.style.zIndex = '100';

                    requestAnimationFrame(() => {
                        requestAnimationFrame(() => {
                            oldBackCover.classList.add('is-closing-back');
                        });
                    });
                }

                // Гасим фон и воспроизводим звук закрытия
                if (typeof Tone !== 'undefined' && Tone.context.state !== 'running') Tone.context.resume();
                if (this.bgDrone) this.bgDrone.triggerRelease();
                if (this.magicSynth) this.magicSynth.triggerAttackRelease(["C3", "G3"], "2n");

                setTimeout(() => {
                    const bookCover = document.getElementById('bookCover');
                    if (bookCover) bookCover.style.opacity = '0';
                    
                    if (oldBackCover) oldBackCover.style.opacity = '0';
                    
                    const realPages = document.getElementById('realPagesContainer');
                    if (realPages) realPages.style.opacity = '0';
                    
                    const backCoverFinal = document.getElementById('backCoverFinal');
                    if (backCoverFinal) {
                        backCoverFinal.classList.add('show');
                    }
                    
                    window.bookState = "STATE_CLOSED_BACK";
                    this.isAnimating = false;

                    // Запуск финального видео (если включено)
                    if (typeof ENABLE_OUTRO !== 'undefined' && ENABLE_OUTRO) {
                        setTimeout(() => {
                            // ПРОВЕРКА: Запускаем только если пользователь ещё не перевернул книгу обратно!
                            if (window.bookState === "STATE_CLOSED_BACK") {
                                this.playOutro();
                            }
                        }, 1200); 
                    }

                }, 1500);
            }

            flipToFront() {
                if (window.bookState !== "STATE_CLOSED_BACK" || this.isAnimating) return;
                this.isAnimating = true;
                
                this.stopVoiceover(); // Останавливаем финальные пожелания, если пользователь начал читать заново
                
                const backCoverFinal = document.getElementById('backCoverFinal');
                if (backCoverFinal) backCoverFinal.classList.remove('show');

                if (typeof Tone !== 'undefined' && Tone.context.state !== 'running') Tone.context.resume();
                if (this.paperSynth) this.paperSynth.triggerAttackRelease(0.3);
                
                setTimeout(() => {
                    window.bookState = "STATE_COVER";
                    this.updateLayout();
                    
                    const bookCover = document.getElementById('bookCover');
                    if (bookCover) {
                        bookCover.style.opacity = '1';
                        // ВАЖНОЕ ИСПРАВЛЕНИЕ 1: Сбрасываем позицию обложки, чтобы она физически закрыла книгу
                        bookCover.style.transform = ''; 
                        const bBack = bookCover.querySelector('.b-back');
                        if (bBack) bBack.style.display = ''; // Возвращаем внутреннюю часть обложки
                    }
                    
                    const oldBackCover = document.getElementById('oldBackCover');
                    if (oldBackCover) {
                        oldBackCover.style.opacity = '1';
                        oldBackCover.style.zIndex = '';
                        oldBackCover.classList.remove('is-closing-back');
                    }
                    
                    const realPages = document.getElementById('realPagesContainer');
                    if (realPages) realPages.style.opacity = '1';

                    const container = document.getElementById('bookContainer');
                    if (container) {
                        container.classList.remove('is-opened');
                    }
                    
                    const leaves = document.querySelectorAll('.leaf');
                    leaves.forEach(leaf => leaf.classList.remove('is-turned'));
                    
                    const mobilePages = document.querySelectorAll('.mobile-page');
                    mobilePages.forEach(page => {
                        page.classList.remove('is-turned', 'is-active');
                    });
                    if (mobilePages.length > 0) mobilePages[0].classList.add('is-active');

                    // ВАЖНОЕ ИСПРАВЛЕНИЕ 2: Очищаем эффект проявления текста, чтобы при повторном чтении он работал заново
                    document.querySelectorAll('.reveal-overlay').forEach(overlay => {
                        delete overlay.dataset.revealed;
                        overlay.classList.remove('is-active');
                    });

                    this.currentLeafIndex = 0;
                    this.currentPageIndex = 0;
                    this.updateZIndices();

                    this.isAnimating = false;
                }, 800);
            }

            playOutro() {
                const epilogueContainer = document.getElementById('epilogueContainer');
                const outroVideo = document.getElementById('outroVideo');
                const skipBtn = document.getElementById('skipOutroBtn');
                const blackOverlay = document.getElementById('blackOverlay');

                if (!epilogueContainer || !outroVideo) return;

                this.isAnimating = true; // Блокируем взаимодействие с книгой

                // 1. Плавно затемняем экран перед запуском эпилога
                blackOverlay.style.display = 'block';
                requestAnimationFrame(() => {
                    blackOverlay.classList.remove('hidden');
                });

                // 2. Ждем, пока экран станет полностью черным (1 секунда)
                setTimeout(() => {
                    epilogueContainer.style.display = 'flex';
                    requestAnimationFrame(() => {
                        epilogueContainer.style.opacity = '1';
                    });

                    let outroEnded = false;
                    const endOutro = () => {
                        if (outroEnded) return;
                        outroEnded = true;

                        // 3. Плавно скрываем видео (fade to black)
                        outroVideo.classList.add('fade-out');
                        skipBtn.style.opacity = '0';
                        skipBtn.style.pointerEvents = 'none';

                        setTimeout(() => {
                            epilogueContainer.style.display = 'none';
                            epilogueContainer.style.opacity = '0';
                            outroVideo.classList.remove('fade-out'); // сбрасываем состояние
                            skipBtn.style.opacity = '1';
                            skipBtn.style.pointerEvents = 'auto';

                            // 4. Плавно возвращаем закрытую книгу из темноты
                            blackOverlay.classList.add('hidden');
                            
                            setTimeout(() => {
                                blackOverlay.style.display = 'none';
                                this.isAnimating = false; // Снова разрешаем кликнуть на книгу
                                
                                // ЗАПУСК ФИНАЛЬНОГО АУДИО
                                // Оно сработает только после видео, когда появилась обложка
                                this.playSingleAudio('final-wishes');
                                
                            }, 1000); 

                        }, 1500); // 1.5 сек на затухание видео
                    };

                    outroVideo.onended = endOutro;
                    skipBtn.onclick = endOutro;

                    // Убеждаемся, что видео запускается с самого начала
                    outroVideo.currentTime = 0;

                    // Запускаем видео
                    let playPromise = outroVideo.play();
                    if (playPromise !== undefined) {
                        playPromise.catch((e) => {
                            console.warn("Автозапуск финального видео заблокирован", e);
                            endOutro(); // Если видео не найдено или заблокировано — пропускаем эпилог
                        });
                    }
                }, 1000); 
            }
        }

        window.onload = () => {
            window.engine = new BookEngine(BOOK_PAGES);
            window.engine.updateLayout();
            window.engine.initPhysicalPages();
            
            const frontFace = document.querySelector('.b-front');
            if (frontFace) {
                window.engine.loadAndSetImage('front-cover', frontFace);
            }
            
            const innerFrontCover = document.querySelector('.b-inner');
            if (innerFrontCover) {
                window.engine.loadAndSetImage('endpaper', innerFrontCover);
            }
            
            const oldBackCover = document.getElementById('oldBackCover');
            if (oldBackCover) {
                window.engine.loadAndSetImage('back-endpaper', oldBackCover);
            }
            
            const backCoverFinal = document.getElementById('backCoverFinal');
            if (backCoverFinal) {
                window.engine.loadAndSetImage('back-cover', backCoverFinal);
            }

            // Настройка эпилога
            const outroVideo = document.getElementById('outroVideo');
            if (typeof ENABLE_OUTRO !== 'undefined' && ENABLE_OUTRO && outroVideo) {
                outroVideo.src = OUTRO_VIDEO;
                outroVideo.muted = false; // Включаем звук для финала
                outroVideo.load();
            }

            const prologueContainer = document.getElementById('prologueContainer');
            const introVideo = document.getElementById('introVideo');
            const skipIntroBtn = document.getElementById('skipIntroBtn');
            const blackOverlay = document.getElementById('blackOverlay');
            const touchPrompt = document.getElementById('touchPrompt');
            const startScreen = document.getElementById('startScreen');
            const startBtn = document.getElementById('startBtn');

            startBtn.onclick = async () => {
                // Первый клик пользователя: разблокируем аудиоконтекст
                try { 
                    if (typeof Tone !== 'undefined') {
                        await Tone.start(); 
                        if (Tone.context.state !== 'running') {
                            await Tone.context.resume();
                        }
                    }
                } catch(e) {
                    console.warn("Ошибка запуска Tone.js:", e);
                }
                
                // Инициализируем музыкальные синтезаторы
                window.engine.initAudio();

                // Секретный трюк для iOS/Safari: пред-разблокировка финального видео
                if (outroVideo && typeof ENABLE_OUTRO !== 'undefined' && ENABLE_OUTRO) {
                    outroVideo.play().then(() => { outroVideo.pause(); outroVideo.currentTime = 0; }).catch(() => {});
                }

                startScreen.style.opacity = '0';
                setTimeout(() => { startScreen.style.display = 'none'; }, 800);

                if (ENABLE_INTRO) {
                    introVideo.src = INTRO_VIDEO;
                    introVideo.muted = false; // ЗВУК ВКЛЮЧЕН!
                    introVideo.load();
                    
                    window.engine.isAnimating = true; 
                    let prologueEnded = false;

                    const endPrologue = () => {
                        if (prologueEnded) return;
                        prologueEnded = true;

                        const layoutShifter = document.getElementById('layoutShifter');
                        const moonlightGlow = document.getElementById('moonlightGlow');

                        introVideo.classList.add('fade-out');
                        skipIntroBtn.style.opacity = '0';
                        skipIntroBtn.style.pointerEvents = 'none';
                        
                        layoutShifter.style.transition = 'none';
                        layoutShifter.style.opacity = '0';
                        layoutShifter.style.transform = 'scale(0.95)';
                        
                        setTimeout(() => {
                            prologueContainer.style.display = 'none';
                            
                            setTimeout(() => {
                                moonlightGlow.classList.add('cinematic-glow');
                                
                                requestAnimationFrame(() => {
                                    layoutShifter.style.transition = 'opacity 1s ease-out, transform 1s ease-out';
                                    layoutShifter.style.opacity = '1';
                                    layoutShifter.style.transform = 'scale(0.98)';
                                    blackOverlay.classList.add('hidden');
                                });
                                
                                setTimeout(() => {
                                    blackOverlay.style.display = 'none';
                                    
                                    layoutShifter.style.transition = 'transform 0.8s ease-out';
                                    layoutShifter.style.transform = 'scale(1)';
                                    moonlightGlow.classList.remove('cinematic-glow');
                                    
                                    setTimeout(() => {
                                        setTimeout(() => {
                                            window.engine.isAnimating = false; 
                                            
                                            layoutShifter.style.transition = 'transform 1.5s cubic-bezier(0.645, 0.045, 0.355, 1)';
                                            layoutShifter.style.opacity = '';
                                            layoutShifter.style.transform = '';

                                            setTimeout(() => {
                                                if (window.bookState === "STATE_COVER") {
                                                    if (touchPrompt) {
                                                        touchPrompt.classList.add('show');
                                                        window.promptTimeout = setTimeout(() => {
                                                            touchPrompt.classList.remove('show');
                                                        }, 7000);
                                                    }
                                                    
                                                    const coverBeam = document.getElementById('coverBeam');
                                                    if (coverBeam) {
                                                        coverBeam.classList.add('play-beam');
                                                    }
                                                }
                                            }, 500);

                                        }, 500);
                                    }, 800);
                                }, 1000);
                            }, 1000); 
                        }, 1500); 
                    };

                    introVideo.addEventListener('ended', endPrologue);
                    skipIntroBtn.addEventListener('click', endPrologue);
                    introVideo.addEventListener('error', (e) => {
                        console.warn("Видео не найдено. Пропуск пролога.", e);
                        endPrologue();
                    });
                    
                    let playPromise = introVideo.play();
                    if (playPromise !== undefined) {
                        playPromise.catch((e) => {
                            console.warn("Автозапуск заблокирован браузером. Пропуск пролога.", e);
                            endPrologue();
                        });
                    }
                } else {
                    prologueContainer.style.display = 'none';
                    blackOverlay.style.display = 'none';
                }
            };
        };

        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') window.engine.turnPage('next');
            if (e.key === 'ArrowLeft') window.engine.turnPage('prev');
        });
        
        window.addEventListener('resize', () => {
            if (window.engine) {
                const wasMobile = window.engine.isMobileReader;
                window.engine.updateLayout();
                // Реинициализация структуры листов при смене режима экрана
                if (wasMobile !== window.engine.isMobileReader) {
                    window.engine.initPhysicalPages();
                }
            }
        });
    </script>
</body>
</html>
